name: Release candidate packaging
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate exact version tag
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-x86'
          path: out
          merge-multiple: true
      - name: Check complete asset set and checksums
        run: |
          test "$(find out -name '*.zip' | wc -l)" -eq 2
          cd out
          sha256sum -c *.sha256
          cat *.sha256 > SHA256SUMS
      - name: Create draft release for explicit publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "IndexWeaver $GITHUB_REF_NAME" --generate-notes out/*
