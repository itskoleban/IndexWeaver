name: Release candidate packaging
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate exact version tag
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-x86'
          path: out
          merge-multiple: true
      - name: Check complete asset set and checksums
        run: |
          test "$(find out -name '*.zip' | wc -l)" -eq 2
          cd out
          sha256sum -c *.sha256
          cat *.sha256 > SHA256SUMS
      - name: Create draft release for explicit publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "IndexWeaver $GITHUB_REF_NAME" --generate-notes out/*
